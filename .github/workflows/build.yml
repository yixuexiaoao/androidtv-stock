name: Build APK

# 推送到 main：发布预发布版（v<VERSION>-pre.<运行序号>）
# 推送标签 v<VERSION>：发布正式版；标签带 -（如 v1.0.0-rc1）仍为预发布版
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5

      - name: Compute version
        id: version
        run: |
          base=$(tr -d '[:space:]' < VERSION)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
            version="${tag#v}"
            if [ "${version%%-*}" != "$base" ]; then
              echo "::error::标签 $tag 与 VERSION 文件中的 $base 不一致"
              exit 1
            fi
          else
            version="$base-pre.$GITHUB_RUN_NUMBER"
            tag="v$version"
          fi
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "STOCK_VERSION_NAME=$version" >> "$GITHUB_ENV"
          echo "版本 $version，标签 $tag，预发布 $prerelease"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v5
        with:
          validate-wrappers: true

      - name: Restore private signing key (optional)
        env:
          KEYSTORE_B64: ${{ secrets.STOCK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "STOCK_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Using private signing key from secrets"
          else
            echo "Using public sideload signing key from repository"
          fi

      - name: Unit tests and release build
        env:
          STOCK_KEYSTORE_PASSWORD: ${{ secrets.STOCK_KEYSTORE_PASSWORD }}
          STOCK_KEY_ALIAS: ${{ secrets.STOCK_KEY_ALIAS }}
          STOCK_KEY_PASSWORD: ${{ secrets.STOCK_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest assembleRelease 2>&1 | tee build.log

      - name: Report build errors as annotations
        if: failure()
        run: |
          grep -E '^e: |FAILED$|AssertionError|error:|What went wrong' -A1 build.log | head -n 40 | cut -c1-400 | while IFS= read -r line; do
            [ -n "$line" ] && [ "$line" != "--" ] && echo "::error::$line"
          done
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            grep -E '<failure message' "$f" | cut -c1-300 | while IFS= read -r line; do echo "::error file=$(basename "$f")::$line"; done
          done

      - name: Verify APK outputs
        run: |
          ls -la app/build/outputs/apk/release/
          for abi in armeabi-v7a arm64-v8a universal; do
            ls app/build/outputs/apk/release/*-"$abi"-release.apk
          done
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in app/build/outputs/apk/release/*.apk; do
            "$APKSIGNER" verify "$apk" && echo "signature OK: $apk"
          done

      - uses: actions/upload-artifact@v5
        with:
          name: apk-armeabi-v7a
          path: app/build/outputs/apk/release/*-armeabi-v7a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: apk-arm64-v8a
          path: app/build/outputs/apk/release/*-arm64-v8a-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        with:
          name: apk-universal
          path: app/build/outputs/apk/release/*-universal-release.apk
          if-no-files-found: error

      # 当前代码的低版本构建：冒烟测试用它检查更新并下载，验证的是这次提交的下载逻辑
      - name: Build update probe
        env:
          STOCK_VERSION_NAME: 0.0.1-probe.1
          STOCK_VERSION_CODE: "1"
          STOCK_KEYSTORE_PASSWORD: ${{ secrets.STOCK_KEYSTORE_PASSWORD }}
          STOCK_KEY_ALIAS: ${{ secrets.STOCK_KEY_ALIAS }}
          STOCK_KEY_PASSWORD: ${{ secrets.STOCK_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace assembleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: update-probe
          path: app/build/outputs/apk/release/androidtv-stock-0.0.1-probe.1-universal-release.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  smoke:
    # 在 Android TV 模拟器上跑真实流程；通过后才能发布
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: apk-universal
          path: new-apk

      - uses: actions/download-artifact@v5
        with:
          name: update-probe
          path: probe-apk

      - name: Download previous release for upgrade test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p old-apk
          # 第二新的发布：保证有比它更新的版本可供“检查更新”发现
          url=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq '[.[] | select(.tag_name | startswith("v"))][1].assets[] | select(.name | contains("universal")) | .browser_download_url' || true)
          if [ -n "$url" ]; then curl -fsSL -o old-apk/old.apk "$url" && ls -la old-apk; else echo "没有可用的旧版本"; fi

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          force-avd-creation: true
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash scripts/ci-smoke.sh "$(ls new-apk/*.apk | head -1)" old-apk/old.apk "$(ls probe-apk/*.apk | head -1)"

      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: smoke-results
          path: smoke/
          if-no-files-found: ignore

      # 截图放到单独的孤儿分支，方便不登录也能查看；每次覆盖，不累积历史
      - name: Publish screenshots to ci-screens branch
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          [ -d smoke ] || exit 0
          cd smoke
          git init -q -b ci-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "CI 冒烟测试截图 $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/$GITHUB_REPOSITORY.git" ci-screens

  release:
    # 只发布 main 和 v* 标签；拉取请求、其他分支的手动运行只构建
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          pattern: apk-*
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ needs.build.outputs.tag }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          make_latest: ${{ needs.build.outputs.prerelease == 'false' }}
          files: dist/*.apk
          generate_release_notes: true
